[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zynex"
version = "2.0.0"
description = "AI-Powered Research Agent — Autonomous web research, analysis, and professional report generation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shahab Ahmed"},
]
keywords = [
    "ai",
    "research",
    "agent",
    "report-generation",
    "fastapi",
    "llm",
    "web-search",
    "pdf",
    "autonomous",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.104.0,<1.0",
    "uvicorn[standard]>=0.24.0,<1.0",
    "openai>=3.0.0,<4.0",
    "ddgs>=9.0.0",
    "weasyprint>=60.0,<71.0",
    "reportlab>=4.0,<5.0",
    "matplotlib>=3.8.0,<4.0",
    "numpy>=1.26.0",
    "pillow>=10.0,<13.0",
    "jinja2>=3.1.0,<4.0",
    "python-docx>=1.1.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "python-multipart>=0.0.6,<1.0",
    "pydantic>=2.5.0,<3.0",
    "httpx>=0.25.0,<1.0",
    "slowapi>=0.1.9,<1.0",
    "python-json-logger>=2.0.7,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/ShahabAhmed01/zynex-ai"
Repository = "https://github.com/ShahabAhmed01/zynex-ai"
Issues = "https://github.com/ShahabAhmed01/zynex-ai/issues"
Changelog = "https://github.com/ShahabAhmed01/zynex-ai/blob/main/CHANGELOG.md"

[project.scripts]
zynex = "backend.main:start"

# ── Tool Configuration ──────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["templates/*.html"]
